# Dependency updates.
#
# bin/use-stack REWRITES this file on activation, prepending the package
# ecosystem for the language you chose (npm / bundler / pip) ahead of the two
# below. Until then only the language-independent ecosystems are listed, because
# an un-activated repo has no dependency manifest at its root.
#
# Everything is GROUPED — one PR per ecosystem per week for minor+patch, so the
# dependabot-auto-merge workflow lands a single green PR instead of five. Major
# bumps are deliberately left ungrouped and unmerged, for a human to run the
# migration. The `deps` / `ci` / `docker` commit-message prefixes keep
# Dependabot's subjects Conventional-Commit valid, which the Validate PR Title
# check requires.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "docker"
      include: "scope"
