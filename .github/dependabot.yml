# Dependency updates.
#
# bin/use-stack REWRITES this file on activation: it adds the package ecosystem
# for the language you chose (npm / bundler / pip / gomod) and a `docker` entry
# for the app's Dockerfile, next to the github-actions entry below. Until then
# only github-actions is listed. An un-activated repo has no dependency manifest
# and no Dockerfile at its root, and Dependabot fails any job that finds nothing
# to read.
#
# Everything is GROUPED — one PR per ecosystem per week for minor+patch, so the
# dependabot-auto-merge workflow lands a single green PR instead of five. Major
# bumps are deliberately left ungrouped and unmerged, for a human to run the
# migration. The `deps` / `ci` / `docker` commit-message prefixes keep
# Dependabot's subjects Conventional-Commit valid, which the Validate PR Title
# check requires.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
      include: "scope"
